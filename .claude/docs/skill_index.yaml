  - id: debug.pwn_libc
    file: docs/debug/pwn_libc_ld_debug.md
    category: pwn
    triggers:
      - GLIBC
      - version not found
      - ld-linux
      - wrong libc

  - id: debug.web_http
    file: docs/debug/web_http_debug.md
    category: web
    triggers:
      - "403"
      - "404"
      - "500"
      - redirect
      - cookie
      - csrf

handoff_docs:
  - id: handoff.evidence
